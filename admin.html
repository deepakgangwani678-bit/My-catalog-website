<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Catalog Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;font-family:Arial,sans-serif;color:#172033}
header{background:#101c35;color:white;padding:20px}
header h2{margin:0}
.container{max-width:1000px;margin:auto;padding:16px}
.card{background:white;padding:18px;border-radius:13px;margin-bottom:16px;box-shadow:0 2px 10px #0000000b}
input,textarea{width:100%;padding:13px;margin:7px 0 13px;border:1px solid #ccd3df;border-radius:8px;font-size:15px}
button{border:0;padding:11px 14px;border-radius:8px;background:#173d78;color:white;font-weight:bold;margin:4px;cursor:pointer}
.red{background:#c62828}
.green{background:#16834b}
.gray{background:#596579}
.hidden{display:none}
.shop{border:1px solid #e0e5ed;padding:14px;border-radius:10px;margin:12px 0}
.shop h3{margin:3px 0 10px}
.small{font-size:13px;color:#667085;word-break:break-all}
#message{padding:10px;color:#173d78}
.qr{max-width:230px;width:100%;display:block;margin:12px auto}
</style>
</head>
<body>

<header>
<h2>Smart Catalog – Admin Panel</h2>
<p>Manage all your shops</p>
</header>

<div class="container">

<div id="loginBox" class="card">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="dashboard" class="hidden">

<div class="card">
<h2>Welcome Admin</h2>
<button class="gray" onclick="logout()">Logout</button>
<button onclick="loadShops()">Refresh Shops</button>
</div>

<div class="card">
<h2>Create New Shop</h2>
<input id="shopName" placeholder="Shop Name">
<input id="ownerEmail" type="email" placeholder="Owner Email">
<input id="ownerPassword" type="password" placeholder="Owner Password (minimum 6 characters)">
<input id="contact" placeholder="Mobile Number">
<textarea id="description" placeholder="Shop Description"></textarea>
<button onclick="createShop()">Create Shop</button>
</div>

<div class="card">
<h2>All Shops</h2>
<div id="shopList">Loading shops...</div>
</div>

</div>

<div id="message"></div>

</div>

<script>
const SUPABASE_URL = "https://dfuqgijfkbaykgshvlxd.supabase.co";
const SUPABASE_KEY = "sb_publishable_jBM3D-TScCdMmNWTp6Zicg_rzh4zAN_";

const ADMIN_UID = "4471cdf9-38b9-4a1d-b267-67f5c34e70b3";

const SITE_URL = "https://deepakgangwani678-bit.github.io/My-catalog-website";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function msg(text){
  document.getElementById("message").textContent = text;
}

function showDashboard(){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
}

function showLogin(){
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}

async function checkAdmin(){
  const {data:{session}} = await db.auth.getSession();

  if(session && session.user.id === ADMIN_UID){
    showDashboard();
    loadShops();
  }else{
    showLogin();
  }
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  msg("Logging in...");

  const {data,error} = await db.auth.signInWithPassword({
    email,password
  });

  if(error){
    msg(error.message);
    return;
  }

  if(data.user.id !== ADMIN_UID){
    await db.auth.signOut();
    msg("Admin access denied.");
    return;
  }

  msg("Login successful.");
  showDashboard();
  loadShops();
}

async function logout(){
  await db.auth.signOut();
  showLogin();
  msg("Logged out.");
}

async function callFunction(actionData){
  const {data,error} = await db.functions.invoke(
    "admin-manage-shops",
    {body:actionData}
  );

  if(error){
    throw new Error(error.message);
  }

  if(data && data.error){
    throw new Error(data.error);
  }

  return data;
}

async function createShop(){
  const shop_name = document.getElementById("shopName").value.trim();
  const email = document.getElementById("ownerEmail").value.trim();
  const password = document.getElementById("ownerPassword").value;
  const contact = document.getElementById("contact").value.trim();
  const description = document.getElementById("description").value.trim();

  if(!shop_name || !email || password.length < 6){
    msg("Shop name, email and password are required.");
    return;
  }

  msg("Creating shop...");

  try{
    const {data,error} = await db.functions.invoke(
      "create-shop-owner",
      {
        body:{
          shop_name,
          email,
          password,
          contact,
          description
        }
      }
    );

    if(error) throw new Error(error.message);
    if(data.error) throw new Error(data.error);

    msg("Shop created successfully!");

    document.getElementById("shopName").value="";
    document.getElementById("ownerEmail").value="";
    document.getElementById("ownerPassword").value="";
    document.getElementById("contact").value="";
    document.getElementById("description").value="";

    loadShops();

  }catch(error){
    msg("Error: "+error.message);
  }
}

function getCatalogURL(shop){
  if(!shop.slug){
    throw new Error("Shop slug is missing for "+shop.shop_name);
  }

  return SITE_URL+"/catalog.html?shop="+encodeURIComponent(shop.slug);
}

async function loadShops(){
  const box = document.getElementById("shopList");
  box.innerHTML="Loading shops...";

  try{
    const result = await callFunction({action:"list"});
    const shops = result.shops || [];

    if(!shops.length){
      box.innerHTML="No shops found.";
      return;
    }

    box.innerHTML="";

    shops.forEach(shop=>{
      const active = shop.is_active;
      const div = document.createElement("div");
      div.className="shop";

      const title = document.createElement("h3");
      title.textContent=shop.shop_name;

      const details = document.createElement("div");
      details.className="small";
      details.textContent =
        "Owner: "+shop.owner_email+
        " | Products: "+shop.product_count+
        " | Contact: "+(shop.contact || "-")+
        " | Status: "+(active?"Active":"Inactive");

      const url = document.createElement("div");
      url.className="small";

      try{
        url.textContent=getCatalogURL(shop);
      }catch(error){
        url.textContent=error.message;
      }

      const qrButton = document.createElement("button");
      qrButton.textContent="Show QR";
      qrButton.onclick=()=>showQR(shop);

      const editButton = document.createElement("button");
      editButton.textContent="Edit Shop";
      editButton.onclick=()=>editShop(shop);

      const statusButton = document.createElement("button");
      statusButton.className=active?"gray":"green";
      statusButton.textContent=active?"Deactivate":"Activate";
      statusButton.onclick=()=>toggleShop(shop);

      const deleteButton = document.createElement("button");
      deleteButton.className="red";
      deleteButton.textContent="Delete Shop";
      deleteButton.onclick=()=>deleteShop(shop);

      const ownerButton = document.createElement("button");
      ownerButton.className="gray";
      ownerButton.textContent="Owner Dashboard";
      ownerButton.onclick=()=>{
        window.open("owner.html","_blank");
      };

      div.append(
        title,details,url,qrButton,editButton,
        statusButton,deleteButton,ownerButton
      );

      box.appendChild(div);
    });

  }catch(error){
    box.textContent="Error loading shops: "+error.message;
  }
}

async function toggleShop(shop){
  const next = !shop.is_active;

  if(!confirm("Change shop status?")) return;

  try{
    await callFunction({
      action:"toggle",
      shop_id:shop.id,
      is_active:next
    });

    msg("Shop status updated.");
    loadShops();

  }catch(error){
    msg(error.message);
  }
}

async function editShop(shop){
  const name = prompt("Shop Name:",shop.shop_name);
  if(name===null) return;

  const contact = prompt("Contact:",shop.contact || "");
  if(contact===null) return;

  const description = prompt(
    "Description:",
    shop.description || ""
  );
  if(description===null) return;

  try{
    await callFunction({
      action:"edit",
      shop_id:shop.id,
      shop_name:name,
      contact,
      description
    });

    msg("Shop updated successfully.");
    loadShops();

  }catch(error){
    msg(error.message);
  }
}

async function deleteShop(shop){
  const answer = prompt(
    "Type DELETE to permanently delete "+shop.shop_name
  );

  if(answer!=="DELETE") return;

  try{
    msg("Deleting shop...");

    const result = await callFunction({
      action:"delete",
      shop_id:shop.id
    });

    msg(result.message || result.warning || "Delete completed.");
    loadShops();

  }catch(error){
    msg("Delete error: "+error.message);
  }
}

function showQR(shop){
  let url;

  try{
    url=getCatalogURL(shop);
  }catch(error){
    msg(error.message);
    return;
  }

  const w = window.open("","_blank");

  if(!w){
    msg("Please allow pop-ups to open the QR code.");
    return;
  }

  w.document.write(`
    <html>
    <head><title>Shop QR Code</title></head>
    <body style="font-family:Arial;text-align:center;padding:20px">
    <h2>${escapeHTML(shop.shop_name)}</h2>
    <img style="width:250px;max-width:90%"
    src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}">
    <p>${escapeHTML(url)}</p>
    <button onclick="window.print()">Print QR</button>
    </body>
    </html>
  `);
  w.document.close();
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

checkAdmin();
</script>

</body>
</html>
