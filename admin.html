<style>
*{box-sizing:border-box}
:root{
  --green:#176b45;
  --green-dark:#104c34;
  --cream:#f7f5e9;
  --white:#fff;
  --border:#e4e8dc;
  --text:#24352b;
  --muted:#718075;
}
body{
  margin:0;
  background:var(--cream);
  font-family:Arial,sans-serif;
  color:var(--text);
}
header{
  background:linear-gradient(135deg,#176b45,#104c34);
  color:white;
  padding:25px 20px;
}
header h2{margin:0;font-size:24px}
header p{margin:8px 0 0;color:#e0eee4}
.container{max-width:1000px;margin:auto;padding:20px}
.card{
  background:var(--white);
  padding:22px;
  border:1px solid var(--border);
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 5px 20px #193d2810;
}
h2{color:var(--green-dark)}
input,textarea{
  width:100%;
  padding:14px;
  margin:7px 0 13px;
  border:1px solid #d9e1d7;
  border-radius:10px;
  font-size:15px;
  background:#fff;
  color:var(--text);
}
input:focus,textarea:focus{
  outline:2px solid #a6d2b6;
  border-color:var(--green);
}
button{
  border:0;
  padding:12px 17px;
  border-radius:9px;
  background:var(--green);
  color:white;
  font-weight:bold;
  margin:4px;
  cursor:pointer;
}
button:hover{background:var(--green-dark)}
.red{background:#c0392b}
.green{background:#218653}
.gray{background:#647568}
.hidden{display:none}
.shop{
  border:1px solid var(--border);
  background:#fbfcf7;
  padding:17px;
  border-radius:12px;
  margin:13px 0;
}
.shop h3{margin:3px 0 12px;color:var(--green-dark)}
.small{
  font-size:13px;
  color:var(--muted);
  word-break:break-all;
  line-height:1.7;
}
#message{
  padding:12px;
  color:var(--green-dark);
  font-weight:600;
}
.qr{max-width:230px;width:100%;display:block;margin:12px auto}
@media(max-width:600px){
  .container{padding:12px}
  .card{padding:17px}
  header{padding:21px 16px}
  button{padding:12px 13px}
}
</style>
