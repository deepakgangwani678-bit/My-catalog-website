<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Catalog | Smart Catalog</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#182230;
}
header{
  background:#123b32;
  color:white;
  padding:25px 15px;
  text-align:center;
}
header h1{margin:0 0 8px}
main{
  width:94%;
  max-width:1000px;
  margin:25px auto;
}
.card{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-bottom:18px;
  box-shadow:0 3px 15px #00000010;
}
input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:16px;
}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:14px;
}
.product{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
  overflow:hidden;
  padding-bottom:10px;
}
.product img{
  width:100%;
  height:160px;
  object-fit:cover;
  background:#eee;
}
.product h3{margin:10px;font-size:16px}
.product p{margin:8px 10px}
.price{
  color:#14775b;
  font-size:19px;
  font-weight:bold;
}
.muted{color:#667085;font-size:14px}
#message{padding:12px;line-height:1.5}
footer{text-align:center;padding:25px;color:#667085}
</style>
</head>

<body>

<header>
  <h1 id="shopName">Smart Catalog</h1>
  <p id="shopDescription">Digital Store Catalog</p>
</header>

<main>

<section class="card">
  <h2>Find Products</h2>
  <input id="search" placeholder="Search product name or number">
</section>

<section class="card">
  <h2>Our Products</h2>
  <div id="products" class="products"></div>
  <p id="message" class="muted">Loading catalog...</p>
</section>

</main>

<footer>Powered by Smart Catalog</footer>

<script>
"use strict";

const SUPABASE_URL =
"https://dfuqgijfkbaykgshvlxd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jBM3D-TScCdMmNWTp6Zicg_rzh4zAN_";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allProducts = [];

function showMessage(text){
  document.getElementById("message").textContent = text;
}

function renderProducts(list){
  const box = document.getElementById("products");
  box.replaceChildren();

  if(!list.length){
    showMessage("No products available.");
    return;
  }

  showMessage("");

  list.forEach(p=>{
    const card = document.createElement("article");
    card.className = "product";

    const img = document.createElement("img");
    img.src = p.image_url || "https://placehold.co/300x220?text=Product";
    img.alt = p.product_name || "Product";
    img.onerror = ()=> {
      img.onerror = null;
      img.src = "https://placehold.co/300x220?text=Product";
    };

    const name = document.createElement("h3");
    name.textContent = p.product_name || "Product";

    const number = document.createElement("p");
    number.className = "muted";
    number.textContent = "Product No.: " + (p.product_number || "-");

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = "₹" + Number(p.price).toLocaleString("en-IN");

    card.append(img,name,number,price);
    box.appendChild(card);
  });
}

async function loadCatalog(){

  const slug = new URLSearchParams(location.search).get("shop");

  if(!slug){
    document.getElementById("shopName").textContent = "Catalog Not Found";
    showMessage("Invalid catalog link.");
    return;
  }

  const {data:shop,error} = await db
    .from("Shops")
    .select("id,shop_name,description,is_active")
    .eq("slug",slug)
    .maybeSingle();

  if(error) throw error;

  if(!shop || shop.is_active === false){
    document.getElementById("shopName").textContent = "Store Not Found";
    showMessage("This store is unavailable.");
    return;
  }

  document.getElementById("shopName").textContent = shop.shop_name;
  document.getElementById("shopDescription").textContent =
    shop.description || "Welcome to our store";

  const {data:products,error:productError} = await db
    .from("Products")
    .select("id,product_name,product_number,price,image_url")
    .eq("shop_id",shop.id)
    .eq("is_available",true)
    .order("product_name");

  if(productError) throw productError;

  allProducts = products || [];
  renderProducts(allProducts);
}

document.getElementById("search").addEventListener("input",e=>{
  const q = e.target.value.trim().toLowerCase();

  const filtered = allProducts.filter(p=>
    String(p.product_name || "").toLowerCase().includes(q) ||
    String(p.product_number || "").toLowerCase().includes(q)
  );

  renderProducts(filtered);
});

loadCatalog().catch(error=>{
  console.error(error);
  showMessage("Catalog loading failed: " + error.message);
});
</script>

</body>
</html>
