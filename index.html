<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Product Catalog</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff9e9;
  color: #292929;
}

header {
  background: #8b2020;
  color: white;
  text-align: center;
  padding: 25px 12px;
}

header h1 { margin: 0 0 8px; }

.container {
  max-width: 900px;
  margin: auto;
  padding: 16px;
}

input {
  width: 100%;
  padding: 15px;
  box-sizing: border-box;
  border: 2px solid #e6b93d;
  border-radius: 12px;
  font-size: 16px;
  margin-bottom: 15px;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px #0001;
}

.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
}

.details { padding: 12px; }

.number { color: #8b2020; font-size: 12px; }

.price {
  color: #168344;
  font-weight: bold;
  font-size: 20px;
}

@media(min-width:650px) {
  .products { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>

<body>
<header>
  <h1>SMART PRODUCT CATALOG</h1>
  <p>Find Your Product Instantly</p>
</header>

<div class="container">
  <input id="search" placeholder="🔍 Search product name or number...">
  <p id="count"></p>
  <div id="products" class="products"></div>
</div>

<script>
const items = [
  {
    number: "85",
    name: "Tomato",
    price: "₹40",
    image: "https://placehold.co/400x300?text=Tomato"
  },
  {
    number: "86",
    name: "Potato",
    price: "₹30",
    image: "https://placehold.co/400x300?text=Potato"
  },
  {
    number: "87",
    name: "Onion",
    price: "₹35",
    image: "https://placehold.co/400x300?text=Onion"
  },
  {
    number: "88",
    name: "Green Chilli",
    price: "₹25",
    image: "https://placehold.co/400x300?text=Green+Chilli"
  }
];

const search = document.getElementById("search");
const products = document.getElementById("products");
const count = document.getElementById("count");

function showProducts() {
  const q = search.value.trim().toLowerCase();

  const results = items.filter(item =>
    item.name.toLowerCase().includes(q) ||
    item.number.toLowerCase().includes(q)
  );

  count.textContent = results.length + " products found";
  products.innerHTML = "";

  if (!results.length) {
    products.textContent = "No products found.";
    return;
  }

  results.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = item.image;
    img.alt = item.name;

    const details = document.createElement("div");
    details.className = "details";

    const number = document.createElement("p");
    number.className = "number";
    number.textContent = "PRODUCT NO. " + item.number;

    const name = document.createElement("h3");
    name.textContent = item.name;

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = item.price;

    details.append(number, name, price);
    card.append(img, details);
    products.appendChild(card);
  });
}

search.addEventListener("input", showProducts);
showProducts();
</script>
</body>
</html>
