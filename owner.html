<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner Dashboard | GetSmartQR</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f5f7;
  font-family:Arial,sans-serif;
  color:#172b25;
}

header{
  background:#123b32;
  color:white;
  padding:20px;
  text-align:center;
}

main{
  max-width:850px;
  margin:20px auto;
  padding:12px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:18px;
  box-shadow:0 3px 14px #0001;
}

input,button,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:8px;
  font-size:15px;
}

input,select{
  border:1px solid #ddd;
  background:white;
}

button{
  border:0;
  background:#176b50;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

button.danger{background:#b83232}
button.secondary{background:#455a64}

.hidden{display:none}

.product{
  border:1px solid #ddd;
  padding:12px;
  border-radius:10px;
  margin:12px 0;
}

.product img{
  width:100%;
  max-height:180px;
  object-fit:contain;
}

.muted{
  color:#667085;
  font-size:13px;
  overflow-wrap:anywhere;
}

#imagePreview{
  display:none;
  width:100%;
  max-height:220px;
  object-fit:contain;
  margin:10px 0;
  border-radius:10px;
}

.theme-select{
  display:block;
  width:100%;
  padding:15px;
  border:1px solid #cbd5d1;
  border-radius:10px;
  background:#fff;
  font-size:16px;
  color:#172b25;
  margin:12px 0;
}
</style>
</head>

<body>

<header>
<h2>GetSmartQR</h2>
<p>Store Owner Dashboard</p>
</header>

<main>

<!-- OWNER LOGIN -->

<section id="loginBox" class="card">

<h2>Owner Login</h2>

<input id="email" type="email"
placeholder="Email address">

<input id="password" type="password"
placeholder="Password">

<button id="loginButton" onclick="login()">
Sign In
</button>

<p id="loginMessage" class="muted"></p>

</section>


<!-- OWNER DASHBOARD -->

<section id="dashboard" class="hidden">

<!-- STORE DETAILS -->

<div class="card">

<h2>Your Store</h2>

<input id="shopName" placeholder="Shop Name">

<input id="shopDescription" placeholder="Shop Description">

<input id="shopContact" placeholder="Contact Number">

<button onclick="saveShop()">
Save Store Details
</button>

<p id="shopMessage" class="muted"></p>

</div>


<!-- COMPACT THEME SELECTOR -->

<div class="card">

<h2>Choose Catalog Theme</h2>

<p class="muted">
Select the design for your customer catalog.
</p>

<select
id="themeSelect"
class="theme-select"
onchange="saveTheme(this.value)"
aria-label="Choose catalog theme">

<option value="cafe">☕ Cafe Theme</option>

<option value="restaurant">🍽️ Restaurant Theme</option>

</select>

<p id="themeMessage" class="muted">
Your saved catalog theme will appear here.
</p>

</div>


<!-- CATALOG QR -->

<div class="card">

<h2>Your Catalog QR</h2>

<p id="catalogLink" class="muted"></p>

<img id="qrImage"
alt="Shop QR Code"
style="width:180px;display:none">

<button class="secondary" onclick="copyLink()">
Copy Catalog Link
</button>

</div>


<!-- ADD PRODUCT -->

<div class="card">

<h2 id="formTitle">Add Product</h2>

<input id="productName"
placeholder="Product Name">

<input id="productNumber"
placeholder="Product Number">

<input id="productPrice"
type="number"
min="0"
step="0.01"
placeholder="Price">

<label for="productFile">
<b>Choose Product Photo</b>
</label>

<input
id="productFile"
type="file"
accept="image/*"
onchange="previewImage(event)">

<img id="imagePreview"
alt="Selected product preview">

<p class="muted">
Image size: maximum 5 MB.
</p>

<button id="saveProductButton"
onclick="saveProduct()">
Save Product
</button>

<button class="secondary hidden"
id="cancelEdit"
onclick="cancelEdit()">
Cancel Edit
</button>

<p id="productMessage" class="muted"></p>

</div>


<!-- PRODUCT LIST -->

<div class="card">

<h2>Your Products</h2>

<div id="productList">
Loading...
</div>

</div>


<button class="danger" onclick="logout()">
Sign Out
</button>

</section>

</main>
