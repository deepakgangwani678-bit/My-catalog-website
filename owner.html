<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner Dashboard | GetSmartQR</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;font-family:Arial,sans-serif;color:#172b25}
header{background:#123b32;color:white;padding:20px;text-align:center}
main{max-width:850px;margin:20px auto;padding:12px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 3px 14px #0001}
input,button,select{width:100%;padding:13px;margin:7px 0;border-radius:8px;font-size:15px}
input,select{border:1px solid #ddd;background:white;color:#172b25}
button{border:0;background:#176b50;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
button.danger{background:#b83232}
button.secondary{background:#455a64}
.hidden{display:none!important}
.product{border:1px solid #ddd;padding:12px;border-radius:10px;margin:12px 0}
.product img{width:100%;max-height:180px;object-fit:contain}
.muted{color:#667085;font-size:13px;overflow-wrap:anywhere}
#imagePreview{display:none;width:100%;max-height:220px;object-fit:contain;margin:10px 0;border-radius:10px}

.theme-picker{position:relative;margin:15px 0}
.theme-toggle{width:auto;min-width:155px;padding:11px 18px;background:#176b50;border-radius:8px}
.theme-menu{display:none;position:relative;margin-top:8px;border:1px solid #ddd;border-radius:10px;overflow:hidden;background:white}
.theme-menu.open{display:block}
.theme-choice{display:block;width:100%;margin:0;padding:13px;text-align:left;color:#172b25;background:white;border-bottom:1px solid #eee;border-radius:0}
.theme-choice:last-child{border-bottom:0}
.theme-choice.active{background:#effaf4;color:#176b50}
.theme-status{font-weight:bold;color:#176b50}

@media(max-width:520px){
main{padding:10px}
.card{padding:15px}
}
</style>
</head>

<body>

<header>
<h2>GetSmartQR</h2>
<p>Store Owner Dashboard</p>
</header>

<main>

<section id="loginBox" class="card">
<h2>Owner Login</h2>
<input id="email" type="email" placeholder="Email address" autocomplete="username">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button id="loginButton" type="button">Sign In</button>
<p id="loginMessage" class="muted"></p>
</section>

<section id="dashboard" class="hidden">

<div class="card">
<h2>Your Store</h2>
<input id="shopName" placeholder="Shop Name">
<input id="shopDescription" placeholder="Shop Description">
<input id="shopContact" placeholder="Contact Number">
<button id="saveShopButton" type="button">Save Store Details</button>
<p id="shopMessage" class="muted"></p>
</div>

<div class="card">
<h2>Choose Catalog Theme</h2>
<p class="muted">Choose one design for your shop. Your selection will be saved for this shop only.</p>

<div class="theme-picker">
<button type="button" class="theme-toggle" id="themeToggle">Select Theme ▼</button>

<div class="theme-menu" id="themeMenu">
<button type="button" class="theme-choice" data-theme="cafe">☕ Cafe</button>
<button type="button" class="theme-choice" data-theme="restaurant">🍽️ Restaurant</button>
<button type="button" class="theme-choice" data-theme="clothing">👕 Clothing</button>
<button type="button" class="theme-choice" data-theme="hotel">🏨 Hotel</button>
<button type="button" class="theme-choice" data-theme="bakery">🧁 Bakery</button>
<button type="button" class="theme-choice" data-theme="gift">🎁 Gift Shop</button>
<button type="button" class="theme-choice" data-theme="jewellery">💎 Jewellery</button>
<button type="button" class="theme-choice" data-theme="food_cart">🍔 Food Cart</button>
<button type="button" class="theme-choice" data-theme="furniture_hardware">🛋️ Furniture & Hardware</button>
<button type="button" class="theme-choice" data-theme="universal">🏢 Universal Business</button>
</div>
</div>

<button id="saveThemeButton" type="button">Save Theme</button>
<p id="themeMessage" class="muted theme-status"></p>
</div>

<div class="card">
<h2>Your Catalog QR</h2>
<p id="catalogLink" class="muted"></p>
<img id="qrImage" alt="Shop QR Code" style="width:180px;display:none">
<button class="secondary" id="copyLinkButton" type="button">Copy Catalog Link</button>
</div>

<div class="card">
<h2 id="formTitle">Add Product</h2>

<input id="productName" placeholder="Product Name">
<input id="productNumber" placeholder="Product Number">
<input id="productPrice" type="number" min="0" step="0.01" placeholder="Price">

<label for="productFile"><b>Choose Product Photo</b></label>
<input id="productFile" type="file" accept="image/*">

<img id="imagePreview" alt="Selected product preview">
<p class="muted">Image size: maximum 5 MB.</p>

<button id="saveProductButton" type="button">Save Product</button>
<button class="secondary hidden" id="cancelEdit" type="button">Cancel Edit</button>
<p id="productMessage" class="muted"></p>
</div>

<div class="card">
<h2>Your Products</h2>
<div id="productList">Loading...</div>
</div>

<button class="danger" id="logoutButton" type="button">Sign Out</button>

</section>
</main>

<script>
"use strict";

const SUPABASE_URL = "https://dfuqgijfkbaykgshvlxd.supabase.co";
const SUPABASE_KEY = "sb_publishable_jBM3D-TScCdMmNWTp6Zicg_rzh4zAN_";

let db = null;
let currentUser = null;
let currentShop = null;
let editingProductId = null;
let existingImageUrl = "";
let previewObjectUrl = null;

const themes = {
  cafe:"Cafe",
  restaurant:"Restaurant",
  clothing:"Clothing",
  hotel:"Hotel",
  bakery:"Bakery",
  gift:"Gift Shop",
  jewellery:"Jewellery",
  food_cart:"Food Cart",
  furniture_hardware:"Furniture & Hardware",
  universal:"Universal Business"
};

function message(id,text){
  document.getElementById(id).textContent = text;
}

/* LOAD SUPABASE WITH FALLBACK */

function loadScript(url){
  return new Promise((resolve,reject)=>{
    const script = document.createElement("script");
    script.src = url;
    script.onload = resolve;
    script.onerror = ()=>reject(new Error("Could not load " + url));
    document.head.appendChild(script);
  });
}

async function initialiseSupabase(){
  if(window.supabase && window.supabase.createClient){
    db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    return;
  }

  try{
    await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
  }catch(firstError){
    try{
      await loadScript("https://unpkg.com/@supabase/supabase-js@2");
    }catch(secondError){
      throw new Error("Supabase library load nahi hui. Internet check karke page refresh karein.");
    }
  }

  if(!window.supabase || !window.supabase.createClient){
    throw new Error("Supabase library initialise nahi hui. Page refresh karein.");
  }

  db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
}

/* THEME DROPDOWN */

function showSavedTheme(theme){
  const selected = Object.prototype.hasOwnProperty.call(themes,theme)
    ? theme
    : "restaurant";

  document.getElementById("themeToggle").textContent =
    themes[selected] + " ▼";

  document.querySelectorAll(".theme-choice").forEach(button=>{
    button.classList.toggle("active",button.dataset.theme === selected);
  });

  document.getElementById("themeMenu").classList.remove("open");

  message("themeMessage","Current saved theme: " + themes[selected]);
}

document.getElementById("themeToggle").addEventListener("click",()=>{
  document.getElementById("themeMenu").classList.toggle("open");
});

document.querySelectorAll(".theme-choice").forEach(button=>{
  button.addEventListener("click",()=>{
    const theme = button.dataset.theme;

    document.querySelectorAll(".theme-choice").forEach(item=>{
      item.classList.toggle("active",item === button);
    });

    document.getElementById("themeToggle").textContent =
      themes[theme] + " ▼";

    document.getElementById("themeMenu").classList.remove("open");

    message("themeMessage",themes[theme] + " selected. Press Save Theme.");
  });
});

/* LOGIN */

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const button = document.getElementById("loginButton");

  if(!email || !password){
    message("loginMessage","Please enter email and password.");
    return;
  }

  button.disabled = true;
  message("loginMessage","Signing in...");

  try{
    if(!db){
      await initialiseSupabase();
    }

    const {data,error} = await db.auth.signInWithPassword({
      email,
      password
    });

    if(error) throw error;

    currentUser = data.user;
    await openDashboard();

  }catch(error){
    message("loginMessage",error.message || "Login failed. Please try again.");
  }finally{
    button.disabled = false;
  }
}

/* OPEN DASHBOARD */

async function openDashboard(){
  if(!currentUser) return;

  const {data,error} = await db.from("Shops")
    .select("*")
    .eq("owner_id",currentUser.id)
    .limit(1)
    .maybeSingle();

  if(error || !data){
    await db.auth.signOut();
    currentUser = null;

    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");

    message("loginMessage",error ? error.message : "Please login with your store owner account.");
    return;
  }

  currentShop = data;

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  document.getElementById("shopName").value = data.shop_name || "";
  document.getElementById("shopDescription").value = data.description || "";
  document.getElementById("shopContact").value = data.contact || "";

  showSavedTheme(data.theme || "restaurant");
  showCatalogLink();

  await loadProducts();
}

/* CHECK EXISTING SESSION */

async function checkSession(){
  try{
    if(!db) await initialiseSupabase();

    const {data,error} = await db.auth.getSession();
    if(error) throw error;

    if(data.session){
      currentUser = data.session.user;
      await openDashboard();
    }
  }catch(error){
    message("loginMessage",error.message || "Could not connect. Please refresh the page.");
  }
}

/* CATALOG QR LINK */

function showCatalogLink(){
  if(!currentShop || !currentShop.slug) return;

  const link = location.origin +
    location.pathname.replace(/owner\.html$/,"catalog.html") +
    "?shop=" + encodeURIComponent(currentShop.slug);

  document.getElementById("catalogLink").textContent = link;

  const qr = document.getElementById("qrImage");

  qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
    encodeURIComponent(link);

  qr.style.display = "block";
}

/* COPY LINK */

async function copyLink(){
  const link = document.getElementById("catalogLink").textContent;
  if(!link) return;

  try{
    await navigator.clipboard.writeText(link);
    alert("Catalog link copied!");
  }catch(error){
    alert("Please copy the link manually: " + link);
  }
}

/* SAVE STORE DETAILS */

async function saveShop(){
  if(!currentShop) return;

  const button = document.getElementById("saveShopButton");

  const updates = {
    shop_name:document.getElementById("shopName").value.trim(),
    description:document.getElementById("shopDescription").value.trim(),
    contact:document.getElementById("shopContact").value.trim()
  };

  if(!updates.shop_name){
    message("shopMessage","Please enter your shop name.");
    return;
  }

  button.disabled = true;
  message("shopMessage","Saving...");

  try{
    const {data,error} = await db.from("Shops")
      .update(updates)
      .eq("id",currentShop.id)
      .select()
      .single();

    if(error) throw error;

    currentShop = data;
    message("shopMessage","Store details saved successfully.");
    showCatalogLink();

  }catch(error){
    message("shopMessage",error.message);
  }finally{
    button.disabled = false;
  }
}

/* SAVE THEME */

async function saveTheme(){
  if(!currentShop) return;

  const selected = document.querySelector(".theme-choice.active");

  if(!selected){
    message("themeMessage","Please select a theme first.");
    return;
  }

  const theme = selected.dataset.theme;
  const button = document.getElementById("saveThemeButton");

  button.disabled = true;
  button.textContent = "Saving...";
  message("themeMessage","Saving your theme...");

  try{
    const {data,error} = await db.from("Shops")
      .update({theme:theme})
      .eq("id",currentShop.id)
      .select()
      .single();

    if(error) throw error;

    currentShop = data;
    showSavedTheme(data.theme);

    message("themeMessage",themes[theme] + " Theme saved successfully!");

  }catch(error){
    message("themeMessage","Error: " + error.message);
  }finally{
    button.disabled = false;
    button.textContent = "Save Theme";
  }
}

/* IMAGE PREVIEW */

function previewImage(event){
  const file = event.target.files[0];
  const preview = document.getElementById("imagePreview");

  if(previewObjectUrl){
    URL.revokeObjectURL(previewObjectUrl);
    previewObjectUrl = null;
  }

  if(!file){
    preview.style.display = "none";
    return;
  }

  if(!file.type.startsWith("image/")){
    alert("Please choose an image file.");
    event.target.value = "";
    preview.style.display = "none";
    return;
  }

  if(file.size > 5 * 1024 * 1024){
    alert("Image must be smaller than 5 MB.");
    event.target.value = "";
    preview.style.display = "none";
    return;
  }

  previewObjectUrl = URL.createObjectURL(file);
  preview.src = previewObjectUrl;
  preview.style.display = "block";
}

/* UPLOAD PRODUCT IMAGE */

async function uploadProductImage(file){
  const extension = file.name.split(".").pop().toLowerCase();
  const safeExtension = /^[a-z0-9]+$/.test(extension) ? extension : "jpg";

  const filePath = currentShop.id + "/" + crypto.randomUUID() + "." + safeExtension;

  const {error} = await db.storage
    .from("product-images")
    .upload(filePath,file,{
      contentType:file.type,
      upsert:false
    });

  if(error) throw error;

  const {data} = db.storage
    .from("product-images")
    .getPublicUrl(filePath);

  return data.publicUrl;
}

/* SAVE PRODUCT */

async function saveProduct(){
  if(!currentShop) return;

  const name = document.getElementById("productName").value.trim();
  const number = document.getElementById("productNumber").value.trim();
  const priceValue = document.getElementById("productPrice").value;
  const price = Number(priceValue);
  const file = document.getElementById("productFile").files[0];

  if(!name || priceValue === "" || !Number.isFinite(price) || price < 0){
    message("productMessage","Enter a valid product name and price.");
    return;
  }

  if(file && (!file.type.startsWith("image/") || file.size > 5*1024*1024)){
    message("productMessage","Choose a valid image smaller than 5 MB.");
    return;
  }

  const button = document.getElementById("saveProductButton");
  button.disabled = true;
  button.textContent = "Saving...";

  try{
    let imageUrl = existingImageUrl;

    if(file){
      message("productMessage","Uploading image...");
      imageUrl = await uploadProductImage(file);
    }

    const product = {
      product_name:name,
      product_number:number,
      price:price,
      image_url:imageUrl || "",
      shop_id:currentShop.id
    };

    let result;

    if(editingProductId){
      result = await db.from("Products")
        .update(product)
        .eq("id",editingProductId)
        .eq("shop_id",currentShop.id);
    }else{
      product.is_available = true;
      result = await db.from("Products").insert(product);
    }

    if(result.error) throw result.error;

    message("productMessage","Product saved successfully.");

    cancelEdit();
    await loadProducts();

  }catch(error){
    message("productMessage","Error: " + error.message);
  }finally{
    button.disabled = false;
    button.textContent = "Save Product";
  }
}

/* LOAD PRODUCTS */

async function loadProducts(){
  const box = document.getElementById("productList");
  box.textContent = "Loading...";

  const {data,error} = await db.from("Products")
    .select("*")
    .eq("shop_id",currentShop.id)
    .order("created_at",{ascending:false});

  if(error){
    box.textContent = error.message;
    return;
  }

  box.replaceChildren();

  if(!data || !data.length){
    box.textContent = "No products added yet.";
    return;
  }

  data.forEach(p=>{
    const card = document.createElement("div");
    card.className = "product";

    const name = document.createElement("h3");
    name.textContent = p.product_name;

    const number = document.createElement("p");
    number.textContent = "Product No.: " + (p.product_number || "-");

    const price = document.createElement("p");
    price.textContent = "₹" + Number(p.price).toLocaleString("en-IN");

    const availability = document.createElement("p");
    availability.className = "muted";
    availability.textContent = p.is_available ? "Available" : "Unavailable";

    card.append(name,number,price,availability);

    if(p.image_url){
      const img = document.createElement("img");
      img.src = p.image_url;
      img.alt = p.product_name;
      card.prepend(img);
    }

    const edit = document.createElement("button");
    edit.textContent = "Edit Product";
    edit.onclick = ()=>editProduct(p);

    const del = document.createElement("button");
    del.textContent = "Delete Product";
    del.className = "danger";
    del.onclick = ()=>deleteProduct(p.id);

    card.append(edit,del);
    box.append(card);
  });
}

/* EDIT PRODUCT */

function editProduct(p){
  editingProductId = p.id;
  existingImageUrl = p.image_url || "";

  document.getElementById("productName").value = p.product_name || "";
  document.getElementById("productNumber").value = p.product_number || "";
  document.getElementById("productPrice").value = p.price;

  document.getElementById("productFile").value = "";

  const preview = document.getElementById("imagePreview");

  if(existingImageUrl){
    preview.src = existingImageUrl;
    preview.style.display = "block";
  }else{
    preview.style.display = "none";
  }

  document.getElementById("formTitle").textContent = "Edit Product";
  document.getElementById("cancelEdit").classList.remove("hidden");
  document.getElementById("saveProductButton").textContent = "Update Product";

  document.getElementById("formTitle").scrollIntoView({behavior:"smooth"});
}

/* CANCEL EDIT */

function cancelEdit(){
  editingProductId = null;
  existingImageUrl = "";

  document.getElementById("productName").value = "";
  document.getElementById("productNumber").value = "";
  document.getElementById("productPrice").value = "";
  document.getElementById("productFile").value = "";

  const preview = document.getElementById("imagePreview");

  if(previewObjectUrl){
    URL.revokeObjectURL(previewObjectUrl);
    previewObjectUrl = null;
  }

  preview.removeAttribute("src");
  preview.style.display = "none";

  document.getElementById("formTitle").textContent = "Add Product";
  document.getElementById("cancelEdit").classList.add("hidden");
  document.getElementById("saveProductButton").textContent = "Save Product";
}

/* DELETE PRODUCT */

async function deleteProduct(id){
  if(!confirm("Are you sure you want to delete this product?")) return;

  try{
    const {error} = await db.from("Products")
      .delete()
      .eq("id",id)
      .eq("shop_id",currentShop.id);

    if(error) throw error;

    message("productMessage","Product deleted successfully.");
    await loadProducts();

  }catch(error){
    message("productMessage","Error: " + error.message);
  }
}

/* LOGOUT */

async function logout(){
  try{
    if(db) await db.auth.signOut();
  }catch(error){
    console.error(error);
  }

  currentUser = null;
  currentShop = null;

  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("password").value = "";

  message("loginMessage","You have been signed out.");
}

/* BUTTON EVENTS */

document.getElementById("loginButton").addEventListener("click",login);

document.getElementById("password").addEventListener("keydown",event=>{
  if(event.key === "Enter") login();
});

document.getElementById("saveShopButton").addEventListener("click",saveShop);
document.getElementById("saveThemeButton").addEventListener("click",saveTheme);
document.getElementById("copyLinkButton").addEventListener("click",copyLink);
document.getElementById("productFile").addEventListener("change",previewImage);
document.getElementById("saveProductButton").addEventListener("click",saveProduct);
document.getElementById("cancelEdit").addEventListener("click",cancelEdit);
document.getElementById("logoutButton").addEventListener("click",logout);

/* START */

checkSession();

</script>
</body>
</html>
